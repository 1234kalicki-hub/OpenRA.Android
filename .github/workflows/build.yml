name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install android
      - run: pwsh -File OpenRA.Android/package-assets.ps1
      - run: dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '**/*.apk'
